services:
  - type: web
    name: postertown-adminclient
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://postertown-backend-v2.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
